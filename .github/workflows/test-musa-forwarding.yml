name: MUSA forwarding headers

on:
  pull_request:
    paths:
      - "src/torchada/csrc/forwarding/**"
      - "src/torchada/utils/cpp_extension.py"
      - "tests/csrc/runtime_compat.cu"
      - "tests/test_runtime_compat.py"
      - ".github/workflows/test-musa-forwarding.yml"

jobs:
  compile-forwarding-headers:
    runs-on: [self-hosted, linux, x64, s5000-1-gpu-runner]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Compile forwarding headers
        run: python -m pytest -q tests/test_runtime_compat.py
